name: Deploy Test

on:
  push:
    branches:
      - '**'

jobs:
  test-htmlpreview-deployment:
    name: Test htmlpreview Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute preview hash
        id: preview
        run: |
          ORIGIN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          HASH=$(node scripts/prepare-preview.mjs)
          git diff --exit-code -- list-manager.html
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "preview_url=https://htmlpreview.github.io/?https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/list-manager.html#v=$HASH" >> "$GITHUB_OUTPUT"
          echo "Preview URL: https://htmlpreview.github.io/?https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/list-manager.html#v=$HASH"

      - name: Verify raw assets
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/list-manager.html"
          CODE=$(curl -L -s -o /dev/null -w '%{http_code}' "$URL")
          echo "$CODE $URL"
          test "$CODE" = "200"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against htmlpreview
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
