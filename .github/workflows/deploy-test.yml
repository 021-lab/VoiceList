name: Deploy Test - cloudflared

on:
  push:
    branches:
      - '**'

env:
  CLOUDFLARED_URL: https://vlist-cloudflare-backend.smileme.ai

jobs:
  test-cloudflared-deployment:
    name: Test cloudflared Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify prepared preview is current
        run: |
          HASH=$(node scripts/prepare-preview.mjs)
          git diff --exit-code -- list-manager.html
          echo "Preview hash: $HASH"

      - name: Run unit tests
        run: npm run test:unit

      - name: Run voice tests
        run: npm run test:voice

      - name: Verify cloudflared deployment
        run: |
          HEALTH_CODE=$(curl -L -s -o /tmp/cloudflared-health.out -w '%{http_code}' "$CLOUDFLARED_URL/health")
          echo "$HEALTH_CODE $CLOUDFLARED_URL/health"
          test "$HEALTH_CODE" = "200"

          curl -L -s "$CLOUDFLARED_URL/" -o /tmp/cloudflared-index.html
          grep -E 'frontier-tab-btn|__LIST_MANAGER_BUILD_HASH__' /tmp/cloudflared-index.html

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against cloudflared
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.CLOUDFLARED_URL }}/
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
