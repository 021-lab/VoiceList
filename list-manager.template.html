<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="preview-build-hash" content="__PREVIEW_BUILD_HASH__">
<title>Список</title>
<style>
__INLINE_CSS__
</style>
</head>
<body>
<div id="app-root" data-view-mode="list">
  <header>
	    <button id="undo-btn" disabled title="Отменить последнее перетаскивание">↩</button>
	    <h1>Мой список</h1>
	    <button id="settings-btn" class="icon-header-btn" type="button" aria-label="Настройки" title="Настройки">⚙</button>
	    <button id="dialogues-tab-btn" class="header-tab-btn" type="button" aria-pressed="false">Диалоги</button>
	    <button id="frontier-tab-btn" class="header-tab-btn" data-act-id="frontier" data-act-type="tab" title="Показать фронтир задач">Фронтир</button>
	    <button id="view-toggle-btn" title="Переключить вид">Журнал</button>
  </header>

  <div id="list-container"></div>

  <section id="action-log-panel" hidden>
    <div class="action-log-header">
      <h2>Журнал действий</h2>
    </div>
    <div id="action-log-list"></div>
  </section>

  <section id="dialogues-panel" class="dialogues-panel" hidden aria-label="Диалоги">
    <div class="dialogues-header">
      <div>
        <h2>Диалоги</h2>
        <p>Текст голосовых сессий хранится только в этом браузере.</p>
      </div>
      <button id="dialogues-close" class="dialogues-close" type="button" aria-label="Закрыть диалоги">×</button>
    </div>
    <div id="dialogues-list" class="dialogues-list"></div>
  </section>

  <div class="toast" id="toast"></div>
  <button class="add-btn" id="add-btn" aria-label="Добавить задачу">+</button>
	  <div id="realtime-voice-status" class="realtime-voice-status" hidden aria-live="polite"></div>
	  <button id="realtime-voice-btn" class="realtime-voice-btn" type="button" aria-label="Начать голосовой диалог" aria-pressed="false" data-state="idle">
	    <span aria-hidden="true">🎙</span>
	  </button>

  <div id="tag-panel" class="swipe-panel"></div>

  <div id="drop-zone-panel" class="swipe-panel"></div>

	  <div id="voice-overlay" class="voice-overlay" aria-hidden="true"></div>

	  <div class="settings-overlay" id="settings-overlay" aria-hidden="true">
	    <section class="settings-panel" aria-label="Настройки">
	      <div class="settings-header">
	        <h2>Настройки</h2>
	        <button id="settings-close" class="settings-close" type="button" aria-label="Закрыть">×</button>
	      </div>
	      <section class="settings-section" aria-labelledby="openai-key-heading">
	        <h3 id="openai-key-heading">OpenAI Realtime</h3>
	        <p class="settings-help">Ключ сохраняется на сервере для голосового агента и никогда не показывается после сохранения.</p>
	        <label class="settings-field" id="openai-key-field">
	          <span>OpenAI API key</span>
	          <input type="password" id="openai-key-input" placeholder="sk-…" autocomplete="off" autocapitalize="none" spellcheck="false">
	        </label>
	        <button id="openai-key-save" class="settings-primary" type="button">Сохранить ключ на сервере</button>
	        <div id="openai-key-status" class="settings-status" aria-live="polite"></div>
	        <label class="settings-field" style="margin-top: 18px;">
	          <span>Системный промпт голосового агента</span>
	          <textarea id="openai-prompt-input" placeholder="Введите новый системный промпт для realtime-сессии"></textarea>
	        </label>
	        <button id="openai-prompt-save" class="settings-primary" type="button">Сохранить промпт на сервере</button>
	        <div id="openai-prompt-status" class="settings-status" aria-live="polite"></div>
	      </section>
	      <section class="settings-section settings-section-secondary" aria-labelledby="workflowy-heading">
	        <h3 id="workflowy-heading">Workflowy</h3>
	      <label class="settings-field">
	        <span>Workflowy</span>
	        <input type="url" id="workflowy-url-input" placeholder="https://workflowy.com/s/task-tree/..." inputmode="url">
	      </label>
	      <button id="workflowy-import-btn" class="settings-primary" type="button">Импорт</button>
	      <div id="workflowy-import-status" class="settings-status" aria-live="polite"></div>
	      </section>
	    </section>
	  </div>

	  <section class="task-page" id="task-page" aria-hidden="true">
    <div class="task-page-bar">
      <button class="task-page-close" id="task-page-close" type="button">Закрыть</button>
      <button class="task-page-save" id="task-page-save" type="button">Сохранить</button>
      <select class="task-page-status" id="task-page-status" aria-label="Статус задачи">
        <option>Open</option>
        <option>Done</option>
        <option>Focus</option>
        <option>Archive</option>
        <option>Pause</option>
        <option>Info</option>
      </select>
    </div>
    <div class="task-page-body">
      <label class="task-page-field">
        <input type="text" id="task-page-line1" aria-label="Название задачи" maxlength="60">
      </label>
      <a class="task-page-parent" id="task-page-parent" href="#" hidden></a>
      <section class="task-page-subtasks">
        <h3>Подзадачи</h3>
        <div class="task-page-add-child">
          <input type="text" id="task-page-child-input" placeholder="Новая подзадача" maxlength="60">
          <button id="task-page-add-child" type="button">Добавить</button>
        </div>
        <div id="task-page-subtasks"></div>
      </section>
    </div>
  </section>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">Новый элемент</h2>
      <div id="modal-view-content" style="display:none; margin-bottom:12px;">
        <div id="view-line1" style="font-size:17px; font-weight:600; color:#1a1a2e; margin-bottom:5px;"></div>
        <div id="view-line2" style="font-size:14px; color:#888; margin-bottom:8px;"></div>
        <div id="view-tags" class="item-tags"></div>
      </div>
      <input type="text" id="input-line1" placeholder="Название (обязательно)" maxlength="60">
      <input type="text" id="input-line2" placeholder="Подпись (необязательно)" maxlength="80">
      <div class="modal-actions">
        <button class="btn btn-cancel" id="btn-cancel">Отмена</button>
        <button class="btn btn-add" id="btn-confirm">Добавить</button>
      </div>
    </div>
  </div>
</div>

<script>
window.__LIST_MANAGER_BUILD_HASH__ = "__PREVIEW_BUILD_HASH__";
</script>
<script>
__INLINE_JS__
</script>
</body>
</html>
